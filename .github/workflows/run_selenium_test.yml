name: Run Selenium Tests on Kubernetes
on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "Deployment Environment (e.g., staging, production)"
        required: true
        type: string
      NAMESPACE:
        description: "Kubernetes Namespace to deploy the application"
        required: true
        type: string
      IMAGE_NAME:
        description: "Docker Image Name to deploy"
        required: true
        type: string
    secrets:
      KUBECONFIG:
        description: "Kubeconfig file content for accessing the Kubernetes cluster"
        required: true
jobs:
  run-selenium-tests:
    environment: ${{inputs.ENVIRONMENT}}
    runs-on: self-deployed
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt
      - name: Run Selenium Tests
        env:
          APP_BASE_URL: ${{vars.APP_BASE_URL}}
        run: |
          pytest tests/ --html=reports/selenium-report.html --self-contained-html
      - name: Upload Selenium Test Report
        uses: actions/upload-artifact@v3
        with:
          name: selenium-test-report
          path: reports/selenium-report.html
