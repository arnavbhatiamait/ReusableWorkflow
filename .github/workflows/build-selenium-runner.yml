name: CI Pipeline for Selenium Runner custom image
on:
  push:
    branches:
        "*"
    path:
        -selenium-runner/**
        -.github/workflows/build-selenium-runner.yml
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    name: Build and Push Selenium Runner Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Docker Metadata
        uses: docker/metadata-action@v5
        id : meta
        with:
          images: ghrc.io/${{ github.repository}}/selenium-runner
          tags: |
            type=raw,value=latest
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./selenium-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
        #   labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
